name: CI

on:
  pull_request:
  push:
    branches: [main, "deploy/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run gate:parser
      - run: npm run check:dfa
      - run: npm run build
      - run: npm run package
      - run: npm run check:vsix
      - run: xvfb-run -a npm run test:integration
      - name: Upload diagram PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagram-pngs
          path: out/test-artifacts
          if-no-files-found: warn
      - name: Integration tests on minimum VS Code
        run: VSCODE_VERSION="$(node -p "require('./package.json').engines.vscode.replace(/^[^0-9]*/, '')")" xvfb-run -a npm run test:integration
      - name: Integration tests against the installed .vsix
        run: SYSML_VSIX="$(ls sysml-editor-*.vsix)" xvfb-run -a npm run test:integration
