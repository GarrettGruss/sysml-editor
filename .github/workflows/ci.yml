name: CI

on:
  pull_request:
  push:
    branches: [main, "deploy/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run gate:parser
      - run: npm run build
      - run: xvfb-run -a npm run test:integration
      - name: Integration tests on minimum VS Code
        run: VSCODE_VERSION="$(node -p "require('./package.json').engines.vscode.replace(/^[^0-9]*/, '')")" xvfb-run -a npm run test:integration
